services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: library-qdrant-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - library_qdrant_data:/qdrant/storage
  mongo:
    image: mongo:7
    container_name: library-mongo-local
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - library_mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (error) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s
  forum-moderation:
    build:
      context: ./library-backend/moderation
    container_name: library-forum-moderation
    restart: unless-stopped
    environment:
      FORUM_MODERATION_MODEL: ${FORUM_MODERATION_MODEL:-dangvansam/vietnamese-toxicity}
      FORUM_MODERATION_API_KEY: ${FORUM_MODERATION_API_KEY:-}
      HF_HOME: /root/.cache/huggingface
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - forum_moderation_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  library_mongo_data:
  library_qdrant_data:
  forum_moderation_cache:
